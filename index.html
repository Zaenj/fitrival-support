<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FitRival Support</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <style>
      :root {
        --bg: #0a0a0a;
        --card: #141414;
        --accent: #ff5c5c;
        --text: #ffffff;
        --muted: #b3b3b3;
      }

      * {
        box-sizing: border-box;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, Inter, Helvetica, Arial, sans-serif;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .card {
        background: var(--card);
        padding: 32px;
        border-radius: 16px;
        max-width: 420px;
        width: 100%;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 24px;
        letter-spacing: 0.5px;
      }

      p {
        margin: 0 0 24px;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.6;
      }

      a {
        display: inline-block;
        padding: 12px 20px;
        border-radius: 10px;
        background: var(--accent);
        color: #fff;
        text-decoration: none;
        font-weight: 600;
        transition: transform 0.15s ease, opacity 0.15s ease;
      }

      a:hover {
        transform: translateY(-1px);
        opacity: 0.9;
      }

      footer {
        margin-top: 20px;
        font-size: 12px;
        color: #777;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <h1>FitRival Support</h1>
      <p>
        Need help or have a question about FitRival?  
        Reach out and we’ll get back to you.
      </p>

      <a href="mailto:support@fitrival.com">support@fitrival.com</a>

      <footer>
        © 2026 FitRival
      </footer>
    </div>
  </body>
</html>
